name: Build SeedSigner OS

on:
  push:
    branches:
      - main
      - dev
    # A five-board buildroot run costs about two hours per board. Committing a
    # test script should not start one, and ten of them in a day starved the
    # queue so a workflow that took minutes could not get a runner at all.
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '**/*.md'
      # Every workflow that is not this one. Adding display-rig.yml without
      # adding it here started three five-board runs from three commits that
      # touched nothing but tests, which is the exact thing this list exists to
      # prevent.
      - '.github/workflows/applet-contract.yml'
      - '.github/workflows/display-rig.yml'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      app_repo:
        description: 'SeedSigner app repository URL'
        required: false
        default: 'https://github.com/bitsagarob/doomsigner'
      app_branch:
        description: 'SeedSigner app branch'
        required: false
        default: 'dev'
      seedsigner_release_tag:
        description: 'SeedSigner app release tag (overrides app branch if set)'
        required: false
        default: ''
      seedsigner_os_release_tag:
        description: 'SeedSigner OS release tag to upload artifacts to (e.g. v1.0.0)'
        required: false
        default: ''
      upload_to_release:
        description: 'Upload build artifacts to the seedsigner-os release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - config: pi0-smartcard-dev
            board_flag: --pi0
          - config: pi02w-smartcard-dev
            board_flag: --pi02w
          - config: pi2-smartcard-dev
            board_flag: --pi2
          - config: pi4-smartcard-dev
            board_flag: --pi4
          - config: lafrite-smartcard-dev
            board_flag: --lafrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.config }}-
            ccache-

      - name: Create required directories
        run: |
          mkdir -p images
          mkdir -p buildroot_dl

      - name: Build ${{ matrix.config }}
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          SS_ARGS: >-
            ${{ matrix.board_flag }}
            --smartcard
            --dev
            --app-repo=${{ inputs.app_repo || 'https://github.com/bitsagarob/doomsigner' }}
            --app-branch=${{ inputs.seedsigner_release_tag || inputs.app_branch || 'dev' }}
        run: docker compose up --force-recreate --build --exit-code-from build-images

      - name: Check the image can start the wallet
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools cpio lz4 qemu-user-static
          for img in images/seedsigner_os.*.img; do
            [ -f "$img" ] || continue
            python3 tests/test_image_userland.py "$img"
          done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seedsigner-os-${{ matrix.config }}
          path: images/seedsigner_os.*.img
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: success() && inputs.upload_to_release && inputs.seedsigner_os_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for img in images/seedsigner_os.*.img; do
            if [ -f "$img" ]; then
              new_name="seedsigner_os-${{ matrix.config }}.img"
              gh release upload "${{ inputs.seedsigner_os_release_tag }}" "${img}#${new_name}" --clobber
            fi
          done
