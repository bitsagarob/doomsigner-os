# Release-profile images, built on demand.
#
# build.yml passes --dev to every one of its five targets, so the only images CI has ever produced
# are developer images: passwordless root shell, dropbear, network, and a committed SSH private key
# in the OS fork's docs. Those are the right thing for iterating and the wrong thing to put real
# money on, which is what the BIP-353 acceptance run needs.
#
# Kept separate from build.yml rather than folded into it as another matrix dimension, so the
# pipeline that is green stays exactly as it is, and so a release build is always something
# somebody asked for by name rather than something that happens on a push.
name: Build SeedSigner OS (release profile)

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build'
        required: true
        type: choice
        default: pi0-smartcard
        options:
          - pi0-smartcard
          - pi02w-smartcard
          - pi2-smartcard
          - pi4-smartcard
          - lafrite-smartcard
      app_repo:
        description: 'SeedSigner app repository URL'
        required: false
        default: 'https://github.com/bitsagarob/doomsigner'
      app_branch:
        description: 'SeedSigner app branch'
        required: false
        default: 'dev'
      seedsigner_release_tag:
        description: 'SeedSigner app release tag (overrides app branch if set)'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ inputs.board }} (release)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.board }}-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.board }}-release-
            ccache-${{ inputs.board }}-dev-
            ccache-

      - name: Create required directories
        run: |
          mkdir -p images
          mkdir -p buildroot_dl

      # The board flag is derived rather than carried in a matrix, because the choice input already
      # names the profile directory and the two must not be able to disagree.
      - name: Derive the board flag
        id: flags
        run: echo "board_flag=--${{ inputs.board }}" | sed 's/-smartcard//' >> "$GITHUB_OUTPUT"

      # No --dev. That is the entire point of this file.
      - name: Build ${{ inputs.board }}
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          SS_ARGS: >-
            ${{ steps.flags.outputs.board_flag }}
            --smartcard
            --app-repo=${{ inputs.app_repo }}
            --app-branch=${{ inputs.seedsigner_release_tag || inputs.app_branch }}
        run: docker compose up --force-recreate --build --exit-code-from build-images

      # What the image carries is asserted by check_target_rootfs() inside build.sh, against the
      # target tree, because that is the only place the question can be answered. The rootfs is an
      # LZ4-compressed initramfs, so running strings over the .img finds nothing and cheerfully
      # reports every library as missing; the first version of this step did exactly that and
      # failed a perfectly good build.
      #
      # What is left to check here is the profile, which the filename cannot tell you: the slug in
      # seedsigner_os.<slug>.<config>.img is the APP BRANCH, so an image built from branch "dev" is
      # named seedsigner_os.dev.<config>.img whether or not it is a developer image. The partition
      # label is what actually distinguishes them, and a mix-up would put a passwordless root shell
      # and a published SSH key on the card that holds real funds.
      - name: Check this is a release image, not a dev one
        run: |
          set -e
          img=$(ls images/seedsigner_os.*.img | head -1)
          echo "image: ${img}"
          sha256sum "${img}"
          file "${img}"

          echo "--- partition label: release is SEEDSIGNROS, dev is SEEDSIGNDEV ---"
          if strings -a "${img}" | grep -q "SEEDSIGNDEV"; then
            echo "ERROR: this is a dev image"
            exit 1
          fi
          if ! strings -a "${img}" | grep -q "SEEDSIGNROS"; then
            echo "ERROR: no release label found either; do not trust this image"
            exit 1
          fi
          echo "release label confirmed"


      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seedsigner-os-${{ inputs.board }}-release
          path: images/seedsigner_os.*.img
          retention-days: 14
          if-no-files-found: error
