# Does the Python card double still answer like the real applet?
#
# The wallet's unit tests run against FakeCardWithSecrets, a few hundred lines of
# Python imitating the SeedKeeper's nonce vault, because 1800 tests cannot each
# start a JVM. The applet is the Java that gets flashed. Nothing checked that the
# two agree, so the applet could change and every test would keep passing against
# an imitation that had quietly become wrong.
#
# This is the half of the rig that CI can run. It needs python and a JVM and no
# kernel devices, unlike the display layer, which drives a real SPI bus inside
# User-Mode Linux and stays a local tool.
name: Applet contract

on:
  workflow_dispatch:
    inputs:
      applet_ref:
        description: 'Seedkeeper-Applet ref to test against'
        required: false
        default: 'musig2-nonce-vault'
      app_ref:
        description: 'seedsigner app ref to test against'
        required: false
        default: 'dev'
  schedule:
    # Weekly rather than nightly: the applet changes rarely, and a job that
    # mostly reports "nothing moved" gets ignored, which is how a red build
    # goes unnoticed for a month.
    - cron: '17 4 * * 1'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the rig
        uses: actions/checkout@v4

      - name: Check out the wallet
        uses: actions/checkout@v4
        with:
          repository: bitsagarob/doomsigner
          ref: ${{ inputs.app_ref || 'dev' }}
          path: app

      - name: Check out the applet
        uses: actions/checkout@v4
        with:
          repository: bitsagarob/Seedkeeper-Applet
          ref: ${{ inputs.applet_ref || 'musig2-nonce-vault' }}
          path: applet

      # jCardSim needs a JDK 8 to build and to run the applet against, because
      # JavaCard targets that bytecode level.
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jcardsim 3.0.5-SNAPSHOT is the first version implementing
      # ALG_EC_SVDP_DH_PLAIN_XY, which the applet asks for at install time, so
      # anything older cannot even install it. It is not on Maven Central at
      # that version, hence the clone.
      - name: Build jcardsim
        run: |
          git clone --depth 1 https://github.com/martinpaljak/oracle_javacard_sdks.git sdks
          git clone --depth 1 https://github.com/licel/jcardsim.git jcardsim
          # jcardsim's pom installs Oracle's api_classic.jar during the initialize
          # phase, but maven resolves a project's dependencies before running the
          # lifecycle, so the build depends on a side effect of itself. That is
          # tolerated by maven 3.8 and not by 3.9, which is what runners ship, so
          # a build that worked locally failed here. Install it first and the
          # ordering stops mattering.
          mvn -q install:install-file \
            -Dfile="$GITHUB_WORKSPACE/sdks/jc305u4_kit/lib/api_classic.jar" \
            -DgroupId=oracle.javacard -DartifactId=api_classic \
            -Dversion=3.0.5 -Dpackaging=jar
          cd jcardsim
          JC_CLASSIC_HOME="$GITHUB_WORKSPACE/sdks/jc305u4_kit" mvn -q -DskipTests package
          test -f target/jcardsim-3.0.5-SNAPSHOT.jar

      - name: Compile the applet and the pipe
        run: |
          mkdir -p applet/test/classes
          javac -nowarn \
            -cp "$GITHUB_WORKSPACE/jcardsim/target/jcardsim-3.0.5-SNAPSHOT.jar" \
            -d applet/test/classes \
            applet/src/main/java/org/seedkeeper/applet/*.java applet/test/AppletPipe.java

      - name: Wallet dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig
          pip install --quiet -r app/requirements.txt python-periphery

      - name: The fake against the applet
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          JCARDSIM_JAR: ${{ github.workspace }}/jcardsim/target/jcardsim-3.0.5-SNAPSHOT.jar
          APPLET_SRC: ${{ github.workspace }}/applet
          MUSIG2_FIXTURE: ${{ github.workspace }}/app/tests/data/musig2_psbts.json
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tests/display-rig/jcardsim:$GITHUB_WORKSPACE/app/src:$GITHUB_WORKSPACE/app/tests" \
            python3 tests/display-rig/jcardsim/contract_test.py

      - name: Both demos against the applet
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          JCARDSIM_JAR: ${{ github.workspace }}/jcardsim/target/jcardsim-3.0.5-SNAPSHOT.jar
          APPLET_SRC: ${{ github.workspace }}/applet
          MUSIG2_FIXTURE: ${{ github.workspace }}/app/tests/data/musig2_psbts.json
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/display-rig/jcardsim:$GITHUB_WORKSPACE/app/src:$GITHUB_WORKSPACE/app/tests"
          python3 tests/display-rig/jcardsim/demo1_nonce_vault.py
          python3 tests/display-rig/jcardsim/demo2_silent_payment.py
